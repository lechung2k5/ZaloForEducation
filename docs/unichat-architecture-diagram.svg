      .arrow-green { stroke: #13804b; stroke-width: 3; fill: none; marker-start: url(#greenStart); marker-end: url(#greenEnd); }
      .arrow-db { stroke: #169957; stroke-width: 3; fill: none; marker-end: url(#greenEnd); }
      .arrow-orange { stroke: #f28c28; stroke-width: 3; fill: none; marker-start: url(#orangeStart); marker-end: url(#orangeEnd); }
      .arrow-red { stroke: #e5485d; stroke-width: 3; fill: none; marker-start: url(#redStart); marker-end: url(#redEnd); }
      .divider { stroke: #d6e2f5; stroke-width: 2; }
      .soft-line { stroke: #d0d5dd; stroke-width: 2; fill: none; }
