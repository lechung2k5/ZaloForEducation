version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: unichat-backend
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: unichat-web
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - backend/.env
    depends_on:
      - backend
    restart: always
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

